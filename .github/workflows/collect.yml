name: collect

# Grid Pulse WEATHER collector — Open-Meteo only; commits readings back to the repo.
# Demand is collected from India by collector/run_and_push.py (see that file for why).
#
# jam-genome lesson applied: GitHub Actions silently skips a large fraction of cron
# slots (measured here: ~10-12 runs/day, not 96). We sample HOURLY (see
# collector/config.py) but schedule every 15 min so each hourly slot gets several
# attempts; the slot guard makes every run idempotent, so over-scheduling never
# duplicates data. For deterministic firing, an external pinger (cron-job.org ->
# workflow_dispatch) is documented in collector/README.md.

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (UTC); oversamples the hourly slot grid
  workflow_dispatch: {}       # manual run + external-pinger fallback

# Never let two runs push at once.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write             # needed to commit collected data back to the repo

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"   # collectors are stdlib-only; no pip install needed

      # WEATHER ONLY. Demand is collected by collector/run_and_push.py on hardware
      # in India: GitHub runners cannot reach vidyutpravah or meritindia at all
      # (343/343 scheduled attempts failed 2026-07-16 -> 08-10 with URLError, while
      # the same URLs return 200 from India). Running it here only manufactured
      # identical gap records. Re-test any time with the `probe` workflow.
      - name: Collect weather
        id: collect
        run: |
          set +e
          python -m collector.fetch_weather
          echo "weather_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Commit new data
        if: always()
        run: |
          git config user.name  "grid-pulse-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no new data this run"
            exit 0
          fi
          git commit -m "data: collect $(date -u +%Y-%m-%dT%H:%MZ)"
          # A concurrent run may have pushed since checkout — rebase and retry.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push && exit 0
            echo "push attempt $i failed; retrying in 5s"; sleep 5
          done
          echo "::warning::could not push collected data after 3 attempts"

      - name: Alert on weather collector failure
        if: always() && steps.collect.outputs.weather_exit != '0'
        run: |
          echo "::error::fetch_weather exited ${{ steps.collect.outputs.weather_exit }} — check Open-Meteo response shape in collector/fetch_weather.py."
          exit 1
